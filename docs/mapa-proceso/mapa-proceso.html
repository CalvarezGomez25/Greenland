<title>Mapa de proceso PMO360</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Concepto: columna vertebral de seis etapas arriba; carriles por paquete de trabajo debajo; módulos como piezas ubicadas en la etapa donde se usan; conectores de datos entre ellos.
   Identidad: sistema de diseño GreenLand de la plataforma (hojas verdes, tierra, Baloo 2 + Roboto, esquinas redondeadas, sin degradados). */
:root{
  --bg:#ffffff; --fg:#164504; --muted:#555552; --line:#dcdcd8; --surface:#f4f9ea; --surface2:#e6f1d1;
  --accent:#4c700b; --accent-fg:#ffffff; --earth:#7c401d; --flow:#4c700b; --danger:#b23a22;
  --node:#ffffff; --dim:.38;
  --l1:#4c700b; --l1t:#eef5dc;
  --l2:#386631; --l2t:#e4efe1;
  --l3:#7c401d; --l3t:#f6e9df;
  --l4:#5d870e; --l4t:#f0f5d8;
  --l5:#555552; --l5t:#efefec;
  --font-display:'Baloo 2','Varela Round',system-ui,sans-serif; --font-body:'Roboto',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a0a; --fg:#e8f0dc; --muted:#a8b39c; --line:#2b3b24; --surface:#15240f; --surface2:#1f3318;
  --accent:#a9c96c; --accent-fg:#0e1a0a; --earth:#d9a06f; --flow:#a9c96c; --danger:#e8806b; --node:#12200d;
  --l1:#a9c96c; --l1t:#1b2b12; --l2:#8dbf86; --l2t:#18291a; --l3:#d9a06f; --l3t:#2a1d14; --l4:#b8d65a; --l4t:#222c10; --l5:#b3b3ad; --l5t:#1f211c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a0a; --fg:#e8f0dc; --muted:#a8b39c; --line:#2b3b24; --surface:#15240f; --surface2:#1f3318;
  --accent:#a9c96c; --accent-fg:#0e1a0a; --earth:#d9a06f; --flow:#a9c96c; --danger:#e8806b; --node:#12200d;
  --l1:#a9c96c; --l1t:#1b2b12; --l2:#8dbf86; --l2t:#18291a; --l3:#d9a06f; --l3t:#2a1d14; --l4:#b8d65a; --l4t:#222c10; --l5:#b3b3ad; --l5t:#1f211c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-weight:300;font-size:15px;line-height:1.45;margin:0;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
h1{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.1;margin:0;color:var(--accent);text-wrap:balance}
h1 span{display:inline-block;border-bottom:2px solid var(--earth);padding-bottom:4px}
.lede{max-width:68ch;color:var(--muted);margin:10px 0 0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.pill:hover{background:var(--surface)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px;align-items:center}
.roles b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-right:6px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;margin-top:12px}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.sizer{position:relative}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.canvas svg,.sheet svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}.sheet svg.nums,.canvas svg.nums{z-index:4}
.etapa{position:absolute;display:flex;flex-direction:column;justify-content:center;padding:6px 14px 6px 22px;color:var(--accent-fg);background:var(--accent);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,14px 50%)}
.etapa.first{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
.etapa .n{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:500}
.etapa .t{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.05}
.etapa .s{font-size:10.5px;opacity:.92;line-height:1.2;margin-top:2px}
.lane{position:absolute;border-radius:14px;background:var(--lt);border:1px solid color-mix(in srgb,var(--lc) 35%,transparent)}
.lanelabel{position:absolute;display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 14px;border-left:5px solid var(--lc);border-radius:4px}
.lanelabel b{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.1;color:var(--lc)}
.lanelabel i{font-style:normal;font-size:11px;color:var(--muted);line-height:1.25;margin-top:3px}
.colguide{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);pointer-events:none}
.node{position:absolute;text-align:left;background:var(--node);border:1.5px solid var(--lc);border-radius:12px;padding:6px 10px 6px 11px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;gap:1px;transition:opacity .15s,box-shadow .15s,transform .15s;z-index:2}
.node:hover{transform:translateY(-1px)}
.node .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;padding-right:16px}
.node .nm{font-weight:700;font-size:12.5px;line-height:1.15;color:var(--fg)}
.sheet .node{padding:5px 12px 5px 13px}
.sheet .node .nm{font-size:15.5px}
.sheet .node .us{font-size:12.5px;line-height:1.28;-webkit-line-clamp:2}
.sheet .gate{font-size:16px;top:6px;right:9px}
.sheet .node .hd{padding-right:20px}
.sheet .etapa .n{font-size:12px}.sheet .etapa .t{font-size:22px;white-space:nowrap}.sheet .etapa .s{font-size:13px}
.sheet .lanelabel b{font-size:20px}.sheet .lanelabel i{font-size:13px}
.node .us{font-size:11px;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.node.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 45%,transparent);background:var(--lt)}
.node.rel{box-shadow:0 0 0 2px color-mix(in srgb,var(--lc) 35%,transparent)}
.node.dim>*{opacity:var(--dim)}.node.dim{border-color:color-mix(in srgb,var(--lc) 30%,var(--line))}
.gate{position:absolute;top:5px;right:7px;color:var(--earth);font-size:13px;line-height:1}
.chips{display:flex;gap:3px;flex-wrap:nowrap;flex:none}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:1px 6px;border:1px solid var(--lc);color:var(--lc);background:transparent;line-height:1.4}
.chip.D{background:var(--earth);border-color:var(--earth);color:var(--bg)}
.chip.H{background:var(--lc);color:var(--bg)}
.lvl{position:absolute;bottom:6px;right:8px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--lc)}
.node.lvD{border-width:2.5px}
.node.lvH{border-width:1.5px}
.node.lvV{border-style:dashed}
.node.lv0>*{opacity:.3}.node.lv0{border-style:dotted;border-color:var(--line)}
.fl{fill:none;stroke:var(--flow);stroke-width:1.6;opacity:.0}
.fl.on{opacity:.8}
.fl.all{opacity:.4}
.fl.sel{opacity:.95;stroke-width:2.4}
.flnum{fill:var(--bg);stroke:var(--flow);stroke-width:1.2}
.flt{fill:var(--flow);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:var(--font-body)}
.panel{border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px;background:var(--surface);position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:1100px){.panel{position:static;max-height:none}}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1;margin:0;color:var(--accent)}
.panel .tag{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;border:1px solid var(--lc,var(--accent));color:var(--lc,var(--accent));padding:2px 10px;margin:0 6px 8px 0}
.panel h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:16px 0 6px}
.panel p{margin:6px 0;font-size:14px}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.panel li{font-size:13.5px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:13.5px;text-align:left}
.rolelist{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.path{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin-top:10px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.k{display:inline-block;width:18px;height:12px;border-radius:5px;border:1.5px solid var(--accent)}
.k.D{border-width:3px}.k.V{border-style:dashed}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

/* ---------- Lámina para imprimir ---------- */
body.lam{padding:0;background:#e9ece4}
body.lam .app{display:none}
.poster{display:none}
body.lam .poster{display:block}
.posterhost{position:relative;margin:0 auto}
.poster .sheet{position:absolute;left:0;top:0;width:2400px;height:1697px;transform-origin:0 0;background:#fff;color:#164504;overflow:hidden;--bg:#fff;--fg:#164504;--muted:#555552;--line:#dcdcd8;--node:#fff;--surface:#f4f9ea;--accent:#4c700b;--accent-fg:#fff;--earth:#7c401d;--flow:#4c700b;
  --l1:#4c700b;--l1t:#eef5dc;--l2:#386631;--l2t:#e4efe1;--l3:#7c401d;--l3t:#f6e9df;--l4:#5d870e;--l4t:#f0f5d8;--l5:#555552;--l5t:#efefec}
.sheet .ph{position:absolute;left:48px;top:14px;right:48px;display:flex;justify-content:space-between;align-items:flex-start}
.sheet .ph h1{font-size:44px}
.sheet .ph p{margin:4px 0 0;font-size:16px;color:var(--muted);max-width:170ch}
.sheet .pf{position:absolute;left:56px;right:56px}
.sheet .pf h4{font-family:var(--font-display);font-size:19px;margin:0 0 6px;color:var(--accent)}
.rgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.rc{border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.32}
.rc b{display:block;font-family:var(--font-display);font-size:16px;color:var(--accent);line-height:1.1;margin-bottom:3px}
.rc b em{font-style:normal;font-family:var(--font-body);font-size:10px;font-weight:700;border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:5px;vertical-align:1px}
.cols{display:grid;grid-template-columns:1.1fr 2.3fr .6fr;gap:30px;margin-top:10px}
.cols ol,.cols ul{margin:0;padding:0;list-style:none;font-size:12.5px;line-height:1.3;display:flex;flex-direction:column;gap:3px}
.cols .two{columns:3;column-gap:26px;display:block}
.cols .two li{break-inside:avoid;margin-bottom:3px}
.nb{display:inline-flex;width:18px;height:18px;border-radius:50%;border:1.2px solid var(--flow);color:var(--flow);font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-right:7px;flex:none;vertical-align:middle}
.cols li{display:flex;gap:0;align-items:flex-start}
.gt{color:var(--earth);font-size:12px;margin-right:6px}
@media print{
  @page{size:594mm 420mm;margin:0}
  html,body{background:#fff!important;height:var(--hh)!important;overflow:hidden!important}
  body{padding:0!important}
  body .app{display:none!important}
  body .poster{display:block!important}
  .posterhost{width:var(--hw)!important;height:var(--hh)!important;margin:0!important;overflow:hidden;position:relative}
  .poster .sheet{transform:scale(var(--ps))!important}
}

/* ---------- Franjas verticales de etapa en la matriz de carriles ---------- */
:root{--band:rgba(0,0,0,.04);--bandline:rgba(0,0,0,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--band:rgba(255,255,255,.055);--bandline:rgba(255,255,255,.16)}}
:root[data-theme="dark"]{--band:rgba(255,255,255,.055);--bandline:rgba(255,255,255,.16)}
.sheet{--band:rgba(0,0,0,.04);--bandline:rgba(0,0,0,.14)}
.vband{position:absolute;pointer-events:none}
.vband.odd{background:var(--band)}
.vline{position:absolute;width:0;border-left:1px solid var(--bandline);pointer-events:none}
.stag{position:absolute;transform:translate(-50%,-50%);z-index:3;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;pointer-events:none;
  background:var(--bg);color:var(--lc);border:1.5px solid var(--lc);border-radius:999px;padding:0 8px 0 2px;height:16px;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.stag b{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:50%;background:var(--lc);color:var(--bg);font-size:9px}
.sheet .stag{height:20px;font-size:12px;padding:0 10px 0 2px;gap:5px}.sheet .stag b{width:16px;height:16px;font-size:11px}
/* ---------- Controles, mapa de metro y versión resumida ---------- */
.ctl{display:flex;flex-wrap:wrap;gap:10px 22px;margin:16px 0 4px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-right:4px}
.cap{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--accent);margin:14px 0 6px}
.cap:first-child{margin-top:0}
.band{position:absolute;pointer-events:none}
.band.b2{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.linebadge{position:absolute;display:flex;align-items:center;gap:8px;background:var(--lc);color:var(--bg);border-radius:999px;padding:4px 12px 4px 4px;z-index:3}
.linebadge i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--lc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.linebadge b{font-family:var(--font-display);font-size:13.5px;line-height:1.05;font-weight:700}
.sheet .linebadge b{font-size:16px}.sheet .linebadge i{width:28px;height:28px;font-size:15px}
.canvas svg.metro,.sheet svg.metro{z-index:0}
svg.metro .trk{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
svg.metro .trk.ghost{opacity:.32;stroke-width:5;stroke-dasharray:1 10}
svg.metro .term{fill:var(--bg);stroke-width:4}
svg.metro .st{fill:var(--bg);transition:opacity .15s}
svg.metro .st.dim,svg.metro .st.lv0{opacity:.3}
svg.metro .st.lvV{stroke-dasharray:4 3}
svg.metro .st.sel{fill:var(--surface2)}
.node.mlabel{background:transparent!important;border:0!important;border-radius:8px;padding:25px 3px 0 3px;box-shadow:none!important;overflow:visible;text-shadow:0 0 2px var(--bg),0 0 3px var(--bg),0 0 5px var(--bg)}
.node.mlabel.sel{background:color-mix(in srgb,var(--lc) 14%,transparent)!important}
.node.mlabel .us{-webkit-line-clamp:1}
.node.mlabel .gate{top:3px;right:4px}
.node.mlabel .lvl{bottom:2px;right:4px}
.sheet .node.mlabel{padding:27px 3px 0 3px}
.sheet .node.mlabel .us{-webkit-line-clamp:2}
.cols.brief{grid-template-columns:2.6fr 1fr}
.cols.brief .two{columns:3}
.pf.bf .rc{font-size:12.5px}
@media (max-width:620px){.ctl{gap:10px 14px}}
</style>

<div class="app">
  <div class="top">
    <div>
      <h1><span>Mapa de proceso PMO360</span></h1>
      <p class="lede">El ciclo de vida de un proyecto de punta a punta: en qué etapa se usa cada módulo, quién interviene, quién decide y cómo pasan los datos de un módulo a otro. Haz clic en un módulo para descubrirlo.</p>
    </div>
  </div>
  <div class="ctl">
    <div class="grp"><b>Estilo</b><button class="pill" id="sCar" aria-pressed="true">Matriz de carriles</button><button class="pill" id="sMet" aria-pressed="false">Mapa de metro</button><button class="pill" id="bCmp" aria-pressed="false">Comparar estilos</button></div>
    <div class="grp"><b>Detalle</b><button class="pill" id="dFull" aria-pressed="true">Completo</button><button class="pill" id="dBrief" aria-pressed="false">Resumido</button></div>
    <div class="grp"><button class="pill" id="bAll" aria-pressed="false">Ver todas las conexiones</button><button class="pill" id="bTheme">Tema: automático</button><button class="pill" id="bLam" aria-pressed="false">Vista de lámina</button></div>
  </div>
  <div class="roles" id="roles" role="group" aria-label="Ver el mapa según el rol"></div>
  <div class="layout">
    <div>
      <div class="cap" id="cap1" hidden></div>
      <div class="mapwrap" id="wrap1"><div class="sizer"><div class="canvas"></div></div></div>
      <div class="cap" id="cap2" hidden></div>
      <div class="mapwrap" id="wrap2" hidden><div class="sizer"><div class="canvas"></div></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<div class="poster" id="poster"><div class="posterhost" id="posterhost"><div class="sheet" id="sheet"></div></div></div>
<style id="pg">@page{size:594mm 420mm;margin:0}</style>

<script>
/* ===================== DATOS ===================== */
const ETAPAS=[
 {n:1,t:'Inicio',s:'Qué es el proyecto y quién interviene'},
 {n:2,t:'Planeación',s:'Alcance, costo, tiempo y riesgos'},
 {n:3,t:'Contratación',s:'Aliados, ofertas y contratos'},
 {n:4,t:'Ejecución',s:'Obra, campo e interventoría'},
 {n:5,t:'Seguimiento y control',s:'Medir, decidir y ajustar'},
 {n:6,t:'Cierre',s:'Entrega, liquidación y aprendizaje'}];
const LANES=[
 {id:'ges',n:'Gestión del proyecto',s:'Planear, controlar y cerrar',c:1},
 {id:'obr',n:'Obra: costo y tiempo',s:'Presupuesto, cronograma y valor ganado',c:2},
 {id:'con',n:'Contratación y RAIZ',s:'Aliados, procesos y contratos',c:3},
 {id:'cam',n:'Campo e interventoría',s:'Lo que pasa en obra y su verificación',c:4},
 {id:'bas',n:'Control y administración',s:'Todo el ciclo: alertas, tableros y reglas',c:5}];
const ROLES=[
 {k:'ad',n:'Administrador',p:'Todo: usuarios, parámetros y estructura. Crea proyectos y asigna personas. Solo él reabre un proyecto cerrado.'},
 {k:'di',n:'Director general',p:'Ve todo el portafolio. Aprueba los contratos nuevos y autoriza anticipos (máx. 20 %). Aprueba los cambios moderados y críticos.'},
 {k:'an',n:'Analista PMO',p:'Ve todo el portafolio. Consolida, evalúa el impacto de los cambios y mantiene el tablero y los reportes.'},
 {k:'ge',n:'Gerente de proyecto',p:'En sus proyectos edita acta, EDT, riesgos, presupuesto, cronograma y contratos. Aprueba cambios menores, adjudica y revisa las novedades.'},
 {k:'pa',n:'Patrocinador',p:'Ve su proyecto. Firma el acta y los cambios de más de 5 % del presupuesto.'},
 {k:'fi',n:'Finanzas',p:'Ve presupuesto, contratos y pagos de todo el portafolio. Hoy solo lectura.'},
 {k:'su',n:'Supervisor de obra',p:'Registra la bitácora con fotos y el avance de sus tareas. Ve el presupuesto.'},
 {k:'in',n:'Interventoría',p:'Ve y conceptúa en sus contratos; verifica el avance y registra hallazgos e informes. No aprueba ni edita contratos; no ve costos.'},
 {k:'co',n:'Consulta',p:'Solo lectura en los proyectos asignados.'}];
const RK=ROLES.map(r=>r.k);
const GEN='ad di an ge pa fi su co', ALL=GEN+' in';
function R(base,over){const o={};base.split(' ').forEach(k=>{if(k)o[k]='V'});(over||'').split(' ').forEach(s=>{if(s){const[k,v]=s.split(':');o[k]=v}});return o}
// row = fila dentro del carril; a..b = etapas (1-6) donde se usa

/* ===================== GEOMETRÍA ===================== */
function geo(cfg){
  const ms=mods(); const g={W:cfg.W,lab:cfg.lab,pad:6,mx:cfg.mx||0,nodeH:cfg.nodeH,gap:cfg.gap,top:cfg.top,spineH:cfg.spineH,laneGap:cfg.laneGap};
  g.colW=(cfg.W-g.mx-cfg.lab-8)/6;
  // filas por carril: en la versión completa se respetan las definidas; en la resumida se reacomodan
  const row={};
  LANES.forEach(l=>{const ls=ms.filter(m=>m.l===l.id).sort((x,y)=>x.row-y.row||x.a-y.a);const placed=[];
    ls.forEach(m=>{let r=st.det==='full'?m.row:0;if(st.det!=='full'){while(placed.some(p=>p.r===r&&!(m.b<p.a||m.a>p.b)))r++}placed.push({a:m.a,b:m.b,r});row[m.id]=r})});
  let y=g.top+g.spineH+cfg.afterSpine; g.lanes={};
  LANES.forEach(l=>{const rs=ms.filter(m=>m.l===l.id).map(m=>row[m.id]);const rows=Math.max(...rs)+1;const h=rows*g.nodeH+(rows-1)*g.gap+(cfg.poster?12:14);g.lanes[l.id]={y,h,rows};y+=h+g.laneGap});
  g.end=y-g.laneGap; g.rect={}; g.row=row;
  ms.forEach(m=>{const L=g.lanes[m.l];g.rect[m.id]={x:g.lab+(m.a-1)*g.colW+g.pad,y:L.y+(cfg.poster?6:7)+row[m.id]*(g.nodeH+g.gap),w:(m.b-m.a+1)*g.colW-g.pad*2,h:g.nodeH}});
  return g;
}
let RECTS={};
function pathFor(A,B){
  const ac={x:A.x+A.w/2,y:A.y+A.h/2},bc={x:B.x+B.w/2,y:B.y+B.h/2};let p0,p1,c0,c1;
  if(B.x>=A.x+A.w-2){p0={x:A.x+A.w,y:ac.y};p1={x:B.x,y:bc.y};const d=Math.max(30,(p1.x-p0.x)/2);c0={x:p0.x+d,y:p0.y};c1={x:p1.x-d,y:p1.y}}
  else if(A.x>=B.x+B.w-2){p0={x:A.x,y:ac.y};p1={x:B.x+B.w,y:bc.y};const d=Math.max(30,(p0.x-p1.x)/2);c0={x:p0.x-d,y:p0.y};c1={x:p1.x+d,y:p1.y}}
  else{const lo=Math.max(A.x,B.x),hi=Math.min(A.x+A.w,B.x+B.w);const x=(lo+hi)/2;
    if(B.y>A.y){p0={x,y:A.y+A.h};p1={x,y:B.y}}else{p0={x,y:A.y};p1={x,y:B.y+B.h}}
    const d=Math.max(26,Math.abs(p1.y-p0.y)/2);c0={x:p0.x,y:p0.y+(p1.y>p0.y?d:-d)};c1={x:p1.x,y:p1.y-(p1.y>p0.y?d:-d)}}
  const at=t=>{const mt=1-t;return{x:mt**3*p0.x+3*mt*mt*t*c0.x+3*mt*t*t*c1.x+t**3*p1.x,y:mt**3*p0.y+3*mt*mt*t*c0.y+3*mt*t*t*c1.y+t**3*p1.y}};
  const inside=q=>Object.values(RECTS).some(r=>q.x>r.x&&q.x<r.x+r.w&&q.y>r.y&&q.y<r.y+r.h);
  let best=at(.5);
  if(inside(best)){for(let k=1;k<=40;k++){const a=at(.5+k*.0125),b=at(.5-k*.0125);if(!inside(a)){best=a;break}if(!inside(b)){best=b;break}}}
  return{d:`M${p0.x},${p0.y} C${c0.x},${c0.y} ${c1.x},${c1.y} ${p1.x},${p1.y}`,mx:best.x,my:best.y};
}

/* ===================== PIEZAS COMUNES ===================== */
function spineHTML(g,cfg){
  return ETAPAS.map((e,i)=>`<div class="etapa${i===0?' first':''}" style="left:${g.lab+i*g.colW+2}px;top:${g.top}px;width:${g.colW-2}px;height:${g.spineH}px"><span class="n">Etapa ${e.n}</span><span class="t">${e.t}</span>${cfg.brief?'':`<span class="s">${e.s}</span>`}</div>`).join('');
}
function textOf(m,cfg){return cfg.poster&&st.det==='full'?m.us:m.co}
function chipsOf(m,cfg){return cfg.chips?`<span class="chips">${RK.filter(k=>m.ro[k]==='D'||m.ro[k]==='H').map(k=>`<span class="chip ${m.ro[k]}">${k.toUpperCase()}</span>`).join('')}</span>`:''}
function stateClass(m,cfg){
  const c=[];
  if(!cfg.poster){
    if(st.role)c.push('lv'+(m.ro[st.role]||'0'));
    if(st.sel===m.id)c.push('sel'); else if(st.sel&&isRel(m.id))c.push('rel'); else if(st.sel)c.push('dim');
  }
  return c.join(' ');
}
function roleTag(m,cfg){return (!cfg.poster&&st.role&&m.ro[st.role])?`<span class="lvl">${m.ro[st.role]==='D'?'◆ DECIDE':m.ro[st.role]==='H'?'● TRABAJA':'○ CONSULTA'}</span>`:''}
function flowsSVG(g,cfg,rectOf){
  const fl=flows();let svg=`<svg width="${g.W}" height="${g.end+10}" viewBox="0 0 ${g.W} ${g.end+10}"><defs><marker id="ah${cfg.poster?'p':''}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="var(--flow)"/></marker></defs>`;
  const nums=[];RECTS=g.rect;
  fl.forEach((f,i)=>{const p=pathFor(rectOf(f[0]),rectOf(f[1]));
    let c='fl';
    if(cfg.poster)c+=' all'; else if(st.sel&&(f[0]===st.sel||f[1]===st.sel))c+=' on sel'; else if(st.all)c+=' all';
    svg+=`<path class="${c}" d="${p.d}" marker-end="url(#ah${cfg.poster?'p':''})"/>`;
    if((cfg.poster&&st.det==='full')||(!cfg.poster&&st.sel&&(f[0]===st.sel||f[1]===st.sel)))nums.push([i+1,p.mx,p.my]);
  });
  svg+='</svg>';
  svg+=`<svg class="nums" width="${g.W}" height="${g.end+10}" viewBox="0 0 ${g.W} ${g.end+10}">`+nums.map(n=>`<circle class="flnum" cx="${n[1]}" cy="${n[2]}" r="9"/><text class="flt" x="${n[1]}" y="${n[2]}" style="${cfg.poster?'font-size:10.5px':''}">${n[0]}</text>`).join('')+'</svg>';
  return svg;
}

/* ===================== ESTILO A: MATRIZ DE CARRILES ===================== */
function carHTML(g,cfg){
  let h=spineHTML(g,cfg);
  LANES.forEach(l=>{const L=g.lanes[l.id];
    h+=`<div class="lane" style="--lc:var(--l${l.c});--lt:var(--l${l.c}t);left:${g.mx}px;top:${L.y}px;width:${g.W-2*g.mx}px;height:${L.h}px"></div>`;
    h+=`<div class="lanelabel" style="--lc:var(--l${l.c});left:${g.mx+6}px;top:${L.y+8}px;width:${g.lab-g.mx-14}px;height:${L.h-16}px"><b>${l.n}</b>${cfg.brief?'':`<i>${l.s}</i>`}</div>`;
  });
  // franjas verticales de etapa: un velo muy leve sobre los carriles, que no cambia su color, y que baja desde cada etapa
  const y0=g.top+g.spineH+3;
  for(let i=0;i<6;i++){
    h+=`<div class="vband${i%2===0?' odd':''}" style="left:${g.lab+i*g.colW}px;top:${y0}px;width:${g.colW}px;height:${g.end-y0+5}px"></div>`;
    if(i>0)h+=`<div class="vline" style="left:${g.lab+i*g.colW}px;top:${y0}px;height:${g.end-y0+5}px"></div>`;
  }
  // marca de etapa al borde superior de cada carril, para saber en qué etapa estás sin volver al encabezado
  LANES.forEach(l=>{const L=g.lanes[l.id];
    ETAPAS.forEach((e,i)=>{h+=`<span class="stag" style="--lc:var(--l${l.c});left:${g.lab+i*g.colW+g.colW/2}px;top:${L.y}px"><b>${e.n}</b>${cfg.brief?'':e.t}</span>`});
  });
  h+=flowsSVG(g,cfg,id=>g.rect[id]);
  h+=mods().map(m=>{const r=g.rect[m.id],L=LI[m.l];const gates=GATES.some(x=>x.m===m.id);
    return `<button class="node ${stateClass(m,cfg)}" data-id="${m.id}" style="--lc:var(--l${L.c});--lt:var(--l${L.c}t);left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px" aria-label="${esc(m.nm)}: ${esc(m.co)}">${gates?'<span class="gate" title="Punto de decisión">◆</span>':''}<span class="hd"><span class="nm">${esc(m.nm)}</span>${chipsOf(m,cfg)}</span><span class="us">${esc(textOf(m,cfg))}</span>${roleTag(m,cfg)}</button>`}).join('');
  return h;
}

/* ===================== ESTILO B: MAPA DE METRO ===================== */
function stationRect(g,m){const r=g.rect[m.id];const ty=r.y+14;const sx=r.x+16;const ex=m.b>m.a?r.x+r.w-16:sx;return{x:sx-10,y:ty-10,w:(ex-sx)+20,h:20,sx,ex,ty}}
function metroHTML(g,cfg){
  let h='';
  // bandas de etapa
  for(let i=0;i<6;i++)h+=`<div class="band${i%2?' b2':''}" style="left:${g.lab+i*g.colW}px;top:${g.top+g.spineH+4}px;width:${g.colW}px;height:${g.end-(g.top+g.spineH+4)+8}px"></div>`;
  h+=spineHTML(g,cfg);
  const ms=mods(),T=g.lab-26;
  // etiquetas de línea
  LANES.forEach((l,i)=>{const L=g.lanes[l.id];
    h+=`<div class="linebadge" style="--lc:var(--l${l.c});left:${g.mx+4}px;top:${L.y+4}px;width:${g.lab-g.mx-34}px"><i>${i+1}</i><b>${l.n}</b></div>`;});
  // vías y estaciones (SVG)
  let svg=`<svg class="metro" width="${g.W}" height="${g.end+10}" viewBox="0 0 ${g.W} ${g.end+10}">`;
  LANES.forEach(l=>{const L=g.lanes[l.id];const lm=ms.filter(m=>m.l===l.id);const col=`var(--l${l.c})`;
    const rowsY=[...Array(L.rows).keys()].map(r=>L.y+6+r*(g.nodeH+g.gap)+14);
    // tronco
    if(L.rows>1)svg+=`<path d="M${T},${rowsY[0]} V${rowsY[L.rows-1]-14}" style="stroke:${col}" class="trk"/>`;
    for(let r=0;r<L.rows;r++){const inRow=lm.filter(m=>g.row[m.id]===r).sort((a,b)=>a.a-b.a);if(!inRow.length)continue;
      const y=rowsY[r];const first=stationRect(g,inRow[0]).sx;const last=Math.max(...inRow.map(m=>stationRect(g,m).ex));
      const start=r===0?`M${T},${y}`:`M${T},${y-14} L${T+14},${y}`;
      svg+=`<path d="${start} H${first}" style="stroke:${col}" class="trk ghost"/>`;
      svg+=`<path d="M${first},${y} H${last}" style="stroke:${col}" class="trk"/>`;
    }
    svg+=`<circle cx="${T}" cy="${rowsY[0]}" r="7" class="term" style="stroke:${col}"/>`;
  });
  ms.forEach(m=>{const s=stationRect(g,m),L=LI[m.l];const cls=['st',stateClass(m,cfg)].filter(Boolean).join(' ');
    const lv=(!cfg.poster&&st.role)?m.ro[st.role]:null;
    const sw=lv==='D'?6:4;
    svg+=m.b>m.a?`<rect class="${cls}" x="${s.sx-9}" y="${s.ty-9}" width="${s.ex-s.sx+18}" height="18" rx="9" style="stroke:var(--l${L.c});stroke-width:${sw}"/>`:`<circle class="${cls}" cx="${s.sx}" cy="${s.ty}" r="9" style="stroke:var(--l${L.c});stroke-width:${sw}"/>`;
  });
  svg+='</svg>';
  h+=svg;
  h+=flowsSVG(g,cfg,id=>stationRect(g,MI[id]));
  h+=ms.map(m=>{const r=g.rect[m.id],L=LI[m.l],sr=stationRect(g,m);const gates=GATES.some(x=>x.m===m.id);
    return `<button class="node mlabel ${stateClass(m,cfg)}" data-id="${m.id}" style="--lc:var(--l${L.c});left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px" aria-label="${esc(m.nm)}: ${esc(m.co)}">${gates?`<span class="gate" title="Punto de decisión" style="left:${sr.ex-r.x+16}px;right:auto;top:3px">◆</span>`:''}<span class="hd"><span class="nm">${esc(m.nm)}</span>${chipsOf(m,cfg)}</span><span class="us">${esc(m.co)}</span>${roleTag(m,cfg)}</button>`}).join('');
  return h;
}

/* ===================== CONFIGURACIONES ===================== */
function cfgFor(sty,poster){
  const brief=st.det==='brief';
  if(!poster){
    return sty==='car'?{lab:132,W:1120,top:6,spineH:brief?50:62,afterSpine:12,nodeH:brief?50:72,gap:8,laneGap:10,brief}
                      :{lab:172,W:1120,top:6,spineH:brief?50:62,afterSpine:14,nodeH:brief?62:78,gap:6,laneGap:6,brief,metro:true};
  }
  if(!brief)return sty==='car'?{lab:270,W:2400,mx:28,top:112,spineH:68,afterSpine:12,nodeH:64,gap:4,laneGap:8,chips:true,poster:true}
                              :{lab:270,W:2400,mx:28,top:112,spineH:68,afterSpine:14,nodeH:62,gap:4,laneGap:6,chips:true,poster:true,metro:true};
  return sty==='car'?{lab:250,W:1800,mx:22,top:92,spineH:56,afterSpine:10,nodeH:54,gap:5,laneGap:8,chips:false,poster:true,brief:true}
                    :{lab:250,W:1800,mx:22,top:92,spineH:56,afterSpine:10,nodeH:58,gap:3,laneGap:6,chips:false,poster:true,brief:true,metro:true};
}
const build=(sty,poster)=>{const cfg=cfgFor(sty,poster);const g=geo(cfg);return{cfg,g,html:(sty==='car'?carHTML:metroHTML)(g,cfg)}};

/* ===================== MAPAS EN PANTALLA ===================== */
const SCALE={};
function drawMap(sty,idx){
  const b=build(sty,false);
  const wrap=document.getElementById('wrap'+idx);
  wrap.querySelector('.canvas').innerHTML=b.html;
  wrap.querySelector('.canvas').style.width=b.cfg.W+'px';wrap.querySelector('.canvas').style.height=(b.g.end+10)+'px';
  SCALE[idx]={W:b.cfg.W,H:b.g.end+10};
}
function fit(){
  [1,2].forEach(i=>{const w=document.getElementById('wrap'+i);if(!w||w.hidden||!SCALE[i])return;
    const aw=w.clientWidth;const s=Math.max(.62,Math.min(1.3,(aw-2)/SCALE[i].W));
    w.querySelector('.canvas').style.transform=`scale(${s})`;const z=w.querySelector('.sizer');z.style.width=SCALE[i].W*s+'px';z.style.height=SCALE[i].H*s+'px'});
}
function render(){
  document.body.classList.toggle('lam',st.lam);
  const dt=document.documentElement; if(st.theme==='auto')dt.removeAttribute('data-theme'); else dt.setAttribute('data-theme',st.theme);
  const set=(id,on)=>{const e=document.getElementById(id);if(e)e.setAttribute('aria-pressed',on?'true':'false')};
  set('bAll',st.all);set('bLam',st.lam);set('bCmp',st.cmp);set('sCar',st.sty==='car');set('sMet',st.sty==='met');set('dFull',st.det==='full');set('dBrief',st.det==='brief');
  $('#bTheme').textContent='Tema: '+({auto:'automático',light:'claro',dark:'oscuro'}[st.theme]);
  $('#roles').innerHTML='<b>Ver como</b>'+['<button class="pill" data-r="" aria-pressed="'+(!st.role)+'">Sin filtro</button>'].concat(ROLES.map(r=>`<button class="pill" data-r="${r.k}" aria-pressed="${st.role===r.k}">${r.n}</button>`)).join('');
  const first=st.cmp?'car':(st.sty==='car'?'car':'met');
  $('#wrap1').hidden=false; $('#wrap2').hidden=!st.cmp;
  $('#cap1').textContent=st.cmp?'A · Matriz de carriles':''; $('#cap1').hidden=!st.cmp;
  $('#cap2').textContent='B · Mapa de metro';
  drawMap(first,1); if(st.cmp)drawMap('met',2);
  fit();
  $('#legend').innerHTML=`<span><i class="k D"></i> Decide o aprueba</span><span><i class="k"></i> Registra o trabaja</span><span><i class="k V"></i> Consulta</span><span style="color:var(--earth)">◆ Punto de decisión</span><span>→ El dato pasa de un módulo a otro</span>`;
  panel();
  if(st.lam)renderPoster();
}
function rolePills(m){return RK.filter(k=>m.ro[k]).map(k=>{const r=ROLES.find(x=>x.k===k);return[r.n,m.ro[k]]})}
function panel(){
  const P=$('#panel');const FL=flows();
  if(st.sel&&MI[st.sel]&&mods().includes(MI[st.sel])){
    const m=MI[st.sel],L=LI[m.l];
    const et=m.l==='bas'?'Todo el ciclo':(m.a===m.b?`Etapa ${m.a} · ${ETAPAS[m.a-1].t}`:`Etapas ${m.a} a ${m.b} · ${ETAPAS[m.a-1].t} a ${ETAPAS[m.b-1].t}`);
    const ins=FL.filter(f=>f[1]===m.id),outs=FL.filter(f=>f[0]===m.id),gt=GATES.filter(x=>x.m===m.id);
    const grp=['D','H','V'].map(v=>{const rs=rolePills(m).filter(x=>x[1]===v).map(x=>x[0]);return rs.length?`<span><b>${v==='D'?'◆ Decide':v==='H'?'● Trabaja':'○ Consulta'}</b></span><span>${rs.join(', ')}</span>`:''}).join('');
    P.style.setProperty('--lc',`var(--l${L.c})`);
    P.innerHTML=`<span class="tag">${L.n}</span><span class="tag" style="--lc:var(--muted)">${et}</span><h2>${esc(m.nm)}</h2>
     <p>${esc(m.us)}</p><p style="color:var(--muted)">${esc(m.de)}</p>
     ${gt.length?`<h3>Puntos de decisión</h3><ul>${gt.map(x=>`<li><span style="color:var(--earth)">◆</span> <b>${x.r}</b>: ${esc(x.t)}</li>`).join('')}</ul>`:''}
     <h3>Quién lo usa</h3><div class="rolelist">${grp}</div>
     ${ins.length?`<h3>Recibe de</h3><ul>${ins.map(f=>`<li><button class="link" data-go="${f[0]}">${esc(MI[f[0]].nm)}</button> <span style="color:var(--muted)">· ${esc(f[2])}</span></li>`).join('')}</ul>`:''}
     ${outs.length?`<h3>Alimenta a</h3><ul>${outs.map(f=>`<li><button class="link" data-go="${f[1]}">${esc(MI[f[1]].nm)}</button> <span style="color:var(--muted)">· ${esc(f[2])}</span></li>`).join('')}</ul>`:''}
     <h3>Dónde está en la plataforma</h3><div class="path">${esc(m.ru)}</div>
     <p style="margin-top:14px"><button class="pill" data-clear="1">Ver el mapa completo</button></p>`;
  }else if(st.role){
    const r=ROLES.find(x=>x.k===st.role);const dec=GATES.filter(x=>x.r.includes(st.role.toUpperCase()));
    const cnt=['D','H','V'].map(v=>mods().filter(m=>m.ro[st.role]===v).length);
    P.style.setProperty('--lc','var(--accent)');
    P.innerHTML=`<span class="tag">Rol</span><h2>${r.n}</h2><p>${esc(r.p)}</p>
     <h3>En el mapa</h3><p>Decide en ${cnt[0]} módulos, trabaja en ${cnt[1]} y consulta ${cnt[2]}. Los demás no los ve.</p>
     ${dec.length?`<h3>Sus puntos de decisión</h3><ul>${dec.map(x=>`<li><span style="color:var(--earth)">◆</span> <button class="link" data-go="${x.m}">${esc(MI[x.m].nm)}</button>: ${esc(x.t)}</li>`).join('')}</ul>`:'<h3>Sus puntos de decisión</h3><p style="color:var(--muted)">Este rol no aprueba nada en la plataforma.</p>'}
     <p class="hint">El borde grueso marca donde decide; el discontinuo, donde solo consulta; lo apagado no lo ve.</p>`;
  }else{
    P.style.setProperty('--lc','var(--accent)');
    P.innerHTML=`<h2>Cómo leer el mapa</h2>
     <p>De izquierda a derecha están las seis etapas del proyecto. Cada paquete de trabajo es una fila de color y cada módulo se ubica en la etapa donde se usa.</p>
     <h3>Para descubrirlo</h3><ul><li>Haz clic en un módulo: verás qué hace, quién lo usa y de dónde recibe y a dónde entrega sus datos.</li><li>Elige un rol arriba: el mapa se ilumina según lo que ese rol ve, hace y decide.</li><li>«Ver todas las conexiones» muestra las ${FL.length} flechas de datos a la vez.</li><li>Cambia entre la <b>matriz de carriles</b> y el <b>mapa de metro</b>, o ponlos lado a lado con «Comparar estilos».</li><li>La versión <b>resumida</b> deja los ${mods().length>20?CORE.size:mods().length} módulos esenciales.</li></ul>
     <h3>Los puntos de decisión</h3><p>Hay ${GATES.length} (marcados con ◆) donde una persona concreta aprueba algo: firmar el acta, aprobar contratos y anticipos, cambios según su nivel, adjudicar, aplicar novedades y cerrar.</p>
     <p class="hint">La etapa en que se ubica cada módulo es una guía de uso, no una restricción: la plataforma deja registrar en cualquier momento lo que el rol permite.</p>`;
  }
}

/* ===================== LÁMINA ===================== */
function renderPoster(){
  const brief=st.det==='brief';const W=brief?1800:2400,H=brief?1273:1697;
  const b=build(st.sty,true);const g=b.g;
  const titulo=`${brief?'Versión resumida':'Versión completa'} · ${st.sty==='car'?'Matriz de carriles':'Mapa de metro'}`;
  let h=`<div class="ph"><div><h1><span>Mapa de proceso PMO360</span></h1><p>Ciclo de vida del proyecto, paquetes de trabajo, módulos, roles y puntos de decisión · Control integral de Proyectos · GreenLand · ${titulo}</p></div><div style="font-size:12px;color:var(--muted);text-align:right;line-height:1.5">Nov. 2026 · Borrador para revisión<br>Los datos de la plataforma son ficticios hasta el piloto</div></div>`;
  h+=b.html;
  const fy=g.end+(brief?14:16);
  const FL=flows();
  if(!brief){
    h+=`<div class="pf" style="top:${fy}px"><h4>Quién puede qué</h4><div class="rgrid">${ROLES.map(r=>`<div class="rc"><b>${r.n}<em>${r.k.toUpperCase()}</em></b>${esc(r.p)}</div>`).join('')}</div>
     <div class="cols"><div><h4>Puntos de decisión ◆</h4><ul>${GATES.map(x=>`<li><span class="gt">◆</span><span><b>${esc(MI[x.m].nm)}</b> · ${x.r}: ${esc(x.t)}</span></li>`).join('')}</ul></div>
     <div><h4>Cómo se conectan los módulos</h4><ol class="two">${FL.map((f,i)=>`<li><span class="nb">${i+1}</span><span>${esc(MI[f[0]].nm)} → ${esc(MI[f[1]].nm)}: ${esc(f[2])}</span></li>`).join('')}</ol></div>
     <div><h4>Cómo leerlo</h4><ul><li><span class="gt">◆</span> Punto de decisión</li><li><span class="chip D" style="margin-right:6px">AD</span> Decide o aprueba</li><li><span class="chip H" style="margin-right:6px;--lc:#4c700b">AD</span> Registra o trabaja</li><li><span class="nb">1</span> Flecha numerada: el dato pasa de un módulo a otro</li><li>Cada módulo está en la etapa donde se usa; quien solo consulta no aparece en las siglas</li></ul></div></div></div>`;
  }else{
    h+=`<div class="pf bf" style="top:${fy}px"><h4>Quién puede qué</h4><div class="rgrid">${ROLES.map(r=>`<div class="rc"><b>${r.n}<em>${r.k.toUpperCase()}</em></b>${esc(SHORT[r.k])}</div>`).join('')}</div>
     <div class="cols brief"><div><h4>Puntos de decisión ◆</h4><ul class="two">${GATES.map(x=>`<li><span class="gt">◆</span><span><b>${esc(MI[x.m].nm)}</b> · ${x.r}: ${esc(x.t)}</span></li>`).join('')}</ul></div>
     <div><h4>Cómo leerlo</h4><ul><li><span class="gt">◆</span> Punto de decisión</li><li><span class="chip D" style="margin-right:6px">AD</span> Decide o aprueba</li><li><span class="chip H" style="margin-right:6px;--lc:#4c700b">AD</span> Registra o trabaja</li><li>→ El dato pasa de un módulo a otro</li></ul></div></div></div>`;
  }
  const sheet=$('#sheet');sheet.innerHTML=h;sheet.style.width=W+'px';sheet.style.height=H+'px';
  const ps=(brief?420:594)/25.4*96/W; // escala a la hoja (A3 o A2)
  const rt=document.documentElement.style;rt.setProperty('--ps',ps);rt.setProperty('--hw',brief?'420mm':'594mm');rt.setProperty('--hh',brief?'297mm':'420mm');$('#pg').textContent=`@page{size:${brief?'420mm 297mm':'594mm 420mm'};margin:0}`;
  const w=Math.min(window.innerWidth-24,1700),s=w/W;
  sheet.style.transform=`scale(${s})`;sheet.dataset.scr=s;$('#posterhost').style.width=W*s+'px';$('#posterhost').style.height=H*s+'px';$('#posterhost').style.margin='12px auto';
}

/* ===================== EVENTOS ===================== */
document.addEventListener('click',e=>{
  const n=e.target.closest('.node');if(n&&!n.closest('.sheet')){st.sel=st.sel===n.dataset.id?null:n.dataset.id;render();return}
  const t=e.target.closest('[data-r]');if(t){st.role=t.dataset.r||null;render();return}
  const go=e.target.closest('[data-go]');if(go){st.sel=go.dataset.go;render();return}
  if(e.target.closest('[data-clear]')){st.sel=null;render();return}
  const id=e.target.closest('button')?.id;
  if(id==='bAll'){st.all=!st.all}
  else if(id==='bCmp'){st.cmp=!st.cmp}
  else if(id==='sCar'){st.sty='car';st.cmp=false}
  else if(id==='sMet'){st.sty='met';st.cmp=false}
  else if(id==='dFull'){st.det='full'}
  else if(id==='dBrief'){st.det='brief'}
  else if(id==='bTheme'){st.theme={auto:'light',light:'dark',dark:'auto'}[st.theme]}
  else if(id==='bLam'){st.lam=!st.lam;location.hash=st.lam?'lamina':''}
  else return;
  render();
});
window.addEventListener('hashchange',()=>{st.lam=location.hash==='#lamina';render()});
window.addEventListener('resize',()=>{fit();if(st.lam)renderPoster()});
window.__set=o=>{Object.assign(st,o);render()};
render();

</script>
